name: jellyfin
namespace: jellyfin

gitRepo: https://github.com/rhoades-brown/argo-config.git
targetRevision: kargo-jellyfin-prod.01m50tne1ex83j2ewgn5w25gta.265a58d

chart:
  repoURL: https://jellyfin.github.io/jellyfin-helm
  name: jellyfin
  version: 3.2.0

valuesFile: valuesfiles/jellyfin.yaml
manifestsPath: manifests/jellyfin

kargo:
  enabled: true
  project: kargo-jellyfin
  autoPromotionEnabled: true
  warehouse:
    interval: 1h0m0s
    images:
      - repoURL: ghcr.io/jellyfin/jellyfin
        tagSelectionStrategy: SemVer
#        allowTagsRegexes:
#        - "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    chart:
      repoURL: https://jellyfin.github.io/jellyfin-helm
      name: jellyfin
      semverConstraint: ">=2.0.0"
  stage:
    imageUpdates:
      - key: image.tag
        image: ghcr.io/jellyfin/jellyfin
        file: valuesfiles/jellyfin.yaml

