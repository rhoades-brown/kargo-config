name: tailscale
namespace: tailscale

gitRepo: https://github.com/rhoades-brown/argo-config.git
targetRevision: kargo-tailscale-prod.01m5fyfqzw0xe9be1tt3wrcy9s.f9ac32c

chart:
  repoURL: https://pkgs.tailscale.com/helmcharts
  name: tailscale-operator
  version: 1.104.2

manifestsPath: manifests/tailscale

managedNamespaceMetadata:
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

kargo:
  enabled: true
  project: kargo-tailscale
  autoPromotionEnabled: true
  warehouse:
    images: []
    chart:
      repoURL: https://pkgs.tailscale.com/helmcharts
      name: tailscale-operator
      semverConstraint: ">=1.94"
  stage:
    imageUpdates: []

