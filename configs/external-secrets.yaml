name: external-secrets
namespace: external-secrets

gitRepo: https://github.com/rhoades-brown/argo-config.git
targetRevision: kargo-external-secrets-prod.01kszrggvx6bwyadt107wbskwq.ebf6ecd

chart:
  repoURL: https://charts.external-secrets.io
  name: external-secrets
  version: 2.5.0

valuesFile: valuesfiles/external-secrets.yaml

extraSyncOptions:
  - ServerSideApply=true
  - RespectIgnoreDifferences=true

ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    jqPathExpressions:
      - .webhooks[].clientConfig.service.name
      - .webhooks[].clientConfig.caBundle


kargo:
  enabled: true
  project: kargo-external-secrets
  autoPromotionEnabled: true
  warehouse:
    images: []
    chart:
      repoURL: https://charts.external-secrets.io
      name: external-secrets
      semverConstraint: ">=1.0.0"
  stage:
    imageUpdates: []
