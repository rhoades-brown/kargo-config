---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-dockerhub-creds
  namespace: kargo-shared-resources
spec:
  secretStoreRef:
    name: pulumi-secret-store
    kind: ClusterSecretStore
  target:
    name: kargo-dockerhub-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      type: Opaque
      data:
        repoURL: "https://index.docker.io/v1/"
        repoURLIsRegex: "false"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: dockerhub.username
    - secretKey: password
      remoteRef:
        key: dockerhub.password
